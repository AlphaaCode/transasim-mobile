name: transasim_mobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.3

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.1.0
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  package_info_plus: ^10.2.1
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  flutter_stripe: ^14.0.0
  mobile_scanner: ^7.4.1
  video_player: ^2.14.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    # Every brand folder ships whole — into ITS OWN flavor only. The loader
    # reads brands/<slug>/brand.json and resolves asset filenames against
    # brands/<slug>/assets/; no path in lib/ ever contains a client slug
    # (ARCHITECTURE-MOBILE.md §2.4). Without `flavors`, every app would carry
    # every other client's configuration, logos and video in its bundle.
    - path: brands/sabily/brand.json
      flavors: [sabily]
    - path: brands/sabily/assets/
      flavors: [sabily]
    - path: brands/esimple/brand.json
      flavors: [esimple]
    - path: brands/esimple/assets/
      flavors: [esimple]

  fonts:
    # Bundled rather than fetched, because the app must render correctly with
    # no network (ARCHITECTURE-MOBILE.md §6.3). NotoSansArabic is declared as a
    # separate family and wired as a fallback on EVERY style in AppType, so one
    # text style renders French and Arabic without the widget knowing which —
    # including the two Latin-only families below, whose Arabic glyphs fall
    # through to Noto per-glyph.
    #
    # Three families, because the design is a deliberate three-font system:
    # Be Vietnam Pro for headlines, IBM Plex Sans for UI chrome (labels,
    # buttons, links, legal), Noto Sans for prose. Only the weights actually
    # named in AppType ship.
    - family: BeVietnamPro
      fonts:
        # Regular: the pack card's price and spec values (63:53).
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
    - family: IBMPlexSans
      fonts:
        # Regular: the "/ GB" unit beside a price (63:80).
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
