<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPC Studio</title>
  <script>
    // The theme before the first paint: the choice saved in this browser, else the system's.
    (() => {
      let saved = null;
      try { saved = localStorage.getItem('studio.theme'); } catch {}
      const light = saved ? saved === 'light' : matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
    })();
  </script>
  <link rel="stylesheet" href="/studio.css">
</head>
<body>
  <header class="top">
    <div class="mark"><span class="reg" aria-hidden="true"></span>SPC Studio</div>
    <nav class="tabs" aria-label="Brand sections">
      <button class="tab is-active" data-view="brand">Brand</button>
      <button class="tab" data-view="assets">Assets</button>
      <button class="tab" data-view="integrations">Integrations</button>
      <button class="tab" data-view="backend">Backend</button>
      <button class="tab" data-view="build">Build</button>
      <button class="tab" data-view="store">Store</button>
      <button class="tab" data-view="logs">Logs</button>
      <button class="tab" data-view="doctor">Doctor</button>
    </nav>
    <p class="tabs-hint" id="tabs-hint" hidden>New brand: pick a brand in the list to use its tabs</p>
    <div class="top-tools">
      <button class="ghost" id="tips-toggle" type="button" aria-pressed="true" title="Show or hide the one-line guide on each page">Tips</button>
      <div class="seg" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="system" aria-pressed="true" title="Follow the system">Auto</button>
        <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
      </div>
    </div>
  </header>

  <aside class="rail" aria-label="Brands">
    <h2 class="label">Brands</h2>
    <ul id="brands"></ul>
    <button class="new-brand" id="new-brand">+ New brand</button>
  </aside>

  <main class="sheet">
    <div class="proof" id="proof" aria-label="Brand colours"></div>
    <p class="guideline" id="guideline" hidden></p>

    <section id="view-brand">
      <div class="sheet-head">
        <h1 id="title">…</h1>
        <div class="chips" id="chips" aria-live="polite"></div>
        <div class="actions">
          <button class="ghost" id="raw-toggle" aria-pressed="false">Raw JSON</button>
          <button class="ghost" id="revert" disabled>Revert</button>
        </div>
      </div>
      <div id="intake-brand" class="intake-brand"></div>
      <form id="form" class="form" autocomplete="off" spellcheck="false"></form>
      <div id="raw" class="raw" hidden>
        <textarea id="raw-text" aria-label="brand.json"></textarea>
        <p class="raw-error" id="raw-error" role="alert"></p>
      </div>
    </section>

    <section id="view-assets" hidden></section>
    <section id="view-integrations" hidden></section>
    <section id="view-backend" hidden></section>
    <section id="view-wizard" hidden></section>
    <section id="view-build" hidden></section>
    <section id="view-store" hidden></section>
    <section id="view-logs" class="logs-view" hidden></section>
    <section id="view-doctor" hidden></section>
  </main>

  <aside class="side" aria-label="Validation and changes">
    <div id="side-brand">
      <section>
        <h2 class="label">Problems <span class="count" id="problem-count"></span></h2>
        <ol id="problems" class="problems"></ol>
      </section>
      <section class="changes-section">
        <h2 class="label">Files Studio would write <span class="count" id="change-count"></span></h2>
        <div id="changes"></div>
        <div id="dirty" class="dirty" hidden></div>
        <button class="apply" id="apply" disabled>Apply</button>
        <p class="toast" id="status" role="status"></p>
        <p class="note">Writes these files only. Never commits, never pushes.</p>
      </section>
    </div>
    <div id="side-plan" hidden></div>
    <div id="side-jobs" hidden></div>
  </aside>

  <script src="/app.js"></script>
  <script src="/intake.js"></script>
  <script src="/assets.js"></script>
  <script src="/wizard.js"></script>
  <script src="/integrations.js"></script>
  <script src="/logs.js"></script>
  <script src="/doctor.js"></script>
  <script src="/backend.js"></script>
  <script src="/store.js"></script>
</body>
</html>
