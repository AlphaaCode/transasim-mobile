id: stripe-account-mismatch
title: 'The app''s key and the backend''s key are different Stripe accounts'
kind: signature
gate: none
match:
  - 'client_secret provided does not match any associated PaymentIntent'
cause: >-
  The backend creates the PaymentIntent with its sk_ key; the app confirms it with its pk_ key.
  From two accounts, the payment sheet fails, and the app shows a declined card.
fix: >-
  Use the pk_ key from the same Stripe account as the backend's sk_ key: pk_test_ on DEV builds,
  pk_live_ in brand.json for PROD.
where: [tool/studio/src/backend.dart, docs/STUDIO-SPEC.md]
evidence: 'unverified wording; the symptom was seen on a device 2026-09-23 (brand_loader.dart)'
brands: [all]
date: 2026-10-11
examples:
  match:
    - 'The client_secret provided does not match any associated PaymentIntent on this account.'
  miss:
    - 'No such customer: ''cus_123'''
