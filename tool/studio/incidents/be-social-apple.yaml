id: be-social-apple
title: 'The backend accepts Sign in with Apple'
kind: check
env: both
gate: test
when: [ios]
severity: {dev: warn, prod: block}
cause: >-
  The iOS app always offers Sign in with Apple, which posts to /v1/auth/apple. acorn-backend has
  no Apple client ids.
fix: >-
  List the brand's bundle id in sabily.social-login.apple.client-ids. It warns on DEV and blocks
  Go prod (STUDIO-SPEC §14.5).
where: [tool/studio/src/backend.dart, docs/STUDIO-SPEC.md]
evidence: 'spc-check/REPORT.md, the dev box on 2026-10-11 (kept outside the repo)'
brands: [all]
date: 2026-10-11
