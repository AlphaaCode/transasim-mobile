id: be-stripe-test
title: 'The DEV backend charges in Stripe test mode'
kind: check
env: dev
gate: test
when: [payments]
cause: >-
  A DEV backend charges test cards only: its secret key is sk_test_, and DEV builds use the same
  account's pk_test_ key. A corrupted or revoked key answers "Invalid API Key provided".
fix: >-
  On this DEV backend only: set the brand's sk_test_ key, run the checker with --stripe-account,
  and record the pk_test_ key in the Backend tab. A backend that is a brand's production
  (servers.yaml prodFor) is never a DEV backend, and gets no test key.
where: [tool/studio/src/backend.dart, docs/STUDIO-SPEC.md]
evidence: 'spc-check/REPORT.md, the dev box on 2026-10-11 (kept outside the repo)'
brands: [all]
date: 2026-10-11
