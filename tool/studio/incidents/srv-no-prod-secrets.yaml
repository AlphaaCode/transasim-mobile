id: srv-no-prod-secrets
title: 'No stray copy of a live Stripe key'
kind: check
env: server
gate: test
severity: {dev: warn, prod: block}
acceptedRisk: >-
  Stray copies of a live Stripe key stay on the box: accepted by Alpha on 2026-10-16 (six files on
  the PROD box, not removed). Delete or move them off the box to take this back.
cause: >-
  A live Stripe key outside a running backend's own config is a copy waiting to leak. Three such
  files sit on the dev box: an env file, a backup and a renamed config.
fix: >-
  Delete the copies, or move them off the box. The live key of a backend this box runs in
  production (servers.yaml prodFor) belongs in that backend's config only.
where: [tool/studio/src/backend.dart, docs/STUDIO-SPEC.md]
evidence: 'spc-check/REPORT.md, the dev box on 2026-10-11 (kept outside the repo)'
brands: [all]
date: 2026-10-11
