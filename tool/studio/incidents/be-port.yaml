id: be-port
title: 'The backend listens on its recorded port'
kind: check
env: both
gate: test
cause: >-
  Each backend on a box needs its own port (9060-9099 on the dev box), and nginx proxies /api/ to
  it.
fix: >-
  Record the port in the Backend tab. server.port in the backend's application-prod.yml must be
  the same, and no other brand on the box may use it.
where: [tool/studio/src/backend.dart, docs/STUDIO-SPEC.md]
evidence: 'spc-check/REPORT.md, the dev box on 2026-10-11 (kept outside the repo)'
brands: [all]
date: 2026-10-11
