id: bash-bang-password
title: 'A ! inside double quotes corrupted a shell command'
kind: signature
gate: none
match:
  - 'event not found'
cause: >-
  Interactive bash expands !word inside double quotes, so a password holding ! is not what was
  typed, or the command fails with "event not found".
fix: >-
  Generate passwords without ! (openssl rand -hex 32), or quote them in single quotes.
where: [tool/studio/src/backend.dart, docs/STUDIO-SPEC.md]
evidence: 'unverified: Alpha''s 4 Oct operations log, quoted on 2026-10-11'
brands: [all]
date: 2026-10-11
examples:
  match:
    - '-bash: !xQ7: event not found'
  miss:
    - '-bash: cd: /apps/acorn: No such file or directory'
