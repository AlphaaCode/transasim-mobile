id: be-db
title: 'The backend''s database answers on the server''s Postgres port'
kind: check
env: both
gate: test
cause: >-
  Postgres runs on 6478 on these boxes, and psql on its default port can reach a different, stray
  listener. The datasource URL must name this database on that port, with a role that exists.
fix: >-
  Use psql -p <pgPort>. Point spring.datasource.url at jdbc:postgresql://127.0.0.1:<pgPort>/<db>,
  and create the role if it is missing.
where: [tool/studio/src/backend.dart, docs/STUDIO-SPEC.md]
evidence: 'spc-check/REPORT.md, the dev box on 2026-10-11 (kept outside the repo)'
brands: [all]
date: 2026-10-11
