id: srv-pg-private
title: 'Postgres cannot be reached from outside'
kind: check
env: server
gate: test
severity: {dev: warn, prod: block}
cause: >-
  On the dev box Postgres listens on every address and ufw lets 6478 through from anywhere. pg_hba
  admits only 127.0.0.1, ::1 and one external address, so it is reachable through ufw but not open
  to the internet: one rule and a password stand in the way.
fix: >-
  Close 6478 in ufw except for the addresses that need it, or make Postgres listen on 127.0.0.1.
  Record why each outside pg_hba rule exists.
where: [tool/studio/src/backend.dart, docs/STUDIO-SPEC.md]
evidence: 'spc-check/REPORT.md, the dev box on 2026-10-11 (kept outside the repo)'
brands: [all]
date: 2026-10-11
