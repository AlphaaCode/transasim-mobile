# Android's Google sign-in needs an Android OAuth client per signing key. A
# build installed from Play is signed with the Play App Signing key, not the
# upload key: without the second client, sign-in fails for every Play install
# (Sabily, 2026-09). Nothing comes back from the console; Studio records which
# two fingerprints the clients were confirmed for, so a key change shows.
id: google-android-client
title: Google Android clients (upload key and Play App Signing)
kind: confirm
urlTemplate: https://console.cloud.google.com/apis/credentials?project={gcpProject}&authuser={authuser}
createUrl:
  - https://console.cloud.google.com/auth/clients/create?project={gcpProject}&authuser={authuser}
  - https://console.cloud.google.com/apis/credentials/oauthclient?project={gcpProject}&authuser={authuser}
requires: [package, uploadSha1, playSigningSha1]
steps:
  - "On \"Create OAuth client ID\", which just opened: Application type \"Android\", name \"{name} Android upload\", package {package}, SHA-1 {uploadSha1} (the upload key). Create."
  - "Open the same page again (Get it) and create \"{name} Android Play\": same package, SHA-1 {playSigningSha1} (the Play App Signing key)."
  - "If Play's App signing page lists \"Previous app signing keys\", create one more client per previous key, with its classical SHA-1 (guide play-signing-sha1 says where). Keep those clients: Play's help says only Android 13 and later enforce the new key, so older phones may still present the previous one."
  - "There is nothing to paste back. Tick below once they all exist."
copyValues:
  - {label: Package name, value: "{package}"}
  - {label: SHA-1 upload key, value: "{uploadSha1}"}
  - {label: SHA-1 Play App Signing, value: "{playSigningSha1}"}
checklistItem: google.android-clients
