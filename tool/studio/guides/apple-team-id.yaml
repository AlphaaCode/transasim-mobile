# The Apple Developer team that signs the brand's iOS build (DEVELOPMENT_TEAM
# in its xcconfig). Also where the bundle id and Sign in with Apple live.
id: apple-team-id
title: Apple team ID
field: studio:appleTeamId
kind: paste
normalize: upper
urlTemplate: https://developer.apple.com/account
createUrl:
  - https://developer.apple.com/account/resources/identifiers/add/bundleId
steps:
  - "On \"Register an App ID\", which just opened: App IDs, then App, then Explicit Bundle ID {bundleId}, tick \"Sign in with Apple\", Register. If it is registered already, skip this."
  - "Open Membership details (developer.apple.com/account) and copy the Team ID."
  - "Paste the Team ID below."
copyValues:
  - {label: Bundle ID, value: "{bundleId}"}
validate:
  - match: '^[A-Z0-9]{10}$'
    message: a Team ID is 10 letters and digits, like DP7F8WQCJD
checklistItem: apple.team-id
examples:
  accept:
    - DP7F8WQCJD
    - dp7f8wqcjd
  reject:
    - DP7F8WQCJ
    - DP7F8WQCJD1
    - DP7F-8WQCJ
