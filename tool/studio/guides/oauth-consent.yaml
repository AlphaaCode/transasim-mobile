# In "Testing", only the listed test users can sign in with Google: everyone
# else gets an error. Publishing is a deliberate step in the console.
id: oauth-consent
title: OAuth consent screen published
kind: confirm
urlTemplate: https://console.cloud.google.com/apis/credentials/consent?project={gcpProject}&authuser={authuser}
createUrl:
  - https://console.cloud.google.com/auth/audience?project={gcpProject}&authuser={authuser}
  - https://console.cloud.google.com/apis/credentials/consent?project={gcpProject}&authuser={authuser}
requires: [gcpProject]
steps:
  - "On the Audience page that just opened (Google Auth Platform), check the publishing status is \"In production\". If it says \"Testing\", press Publish app: in Testing only the listed test users can sign in."
  - "Under Branding, check the user support email is one the client answers and the authorised domains include the brand's own website."
  - "Tick below, with a note of what you saw."
checklistItem: google.consent-published
