# The Flutter template ships -Xmx8G -XX:MaxMetaspaceSize=4G. On a 16GB machine
# that is a daemon entitled to 12GB, competing for the same RAM as the Android
# emulator (~3.7GB resident). The observed result was the emulator being
# OOM-killed four times in one session, System UI crashing, and cold-start
# timings swinging between 5 and 14 seconds — measuring the starved host, not
# the app.
#
# This module builds comfortably in 1.5GB. Raise it if a build actually fails
# on heap, not pre-emptively.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Daemons idle for ten minutes are reclaimed instead of sitting on their heap
# until the machine reboots. The template default is three hours.
org.gradle.daemon.idletimeout=600000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Never auto-download SDK components at build time. Two reasons:
#  - determinism: a build that fetches its own toolchain is not reproducible,
#    and in CI it turns a missing package into a slow surprise instead of a
#    clear failure;
#  - the bundled sdkmanager.bat wrapper mis-parses the ";" in package names and
#    crashes (NTSTATUS 0xC0000409), which hides the real error behind a stack
#    trace about the wrapper.
android.builder.sdkDownload=false
