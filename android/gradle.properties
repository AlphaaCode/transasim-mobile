org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Never auto-download SDK components at build time. Two reasons:
#  - determinism: a build that fetches its own toolchain is not reproducible,
#    and in CI it turns a missing package into a slow surprise instead of a
#    clear failure;
#  - the bundled sdkmanager.bat wrapper mis-parses the ";" in package names and
#    crashes (NTSTATUS 0xC0000409), which hides the real error behind a stack
#    trace about the wrapper.
android.builder.sdkDownload=false
